<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complaint Registration Platform</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <nav id="navbar" class="hidden">
            <div class="nav-content">
                <h1 class="logo">Crime<span>Report</span></h1>
                <div class="nav-links">
                    <span id="user-name"></span>
                    <button id="logout-btn" class="btn-secondary">Logout</button>
                </div>
            </div>
        </nav>

        <main id="main-content">
            <!-- Public Submission Section -->
            <section id="public-section" class="auth-section">
                <div class="card glass">
                    <h2>Police Complaint Portal</h2>
                    <p>Report a crime or public issue directly to the authorities</p>
                    <form id="public-complaint-form">
                        <div class="input-group">
                            <label for="public-name">Full Name</label>
                            <input type="text" id="public-name" required placeholder="Enter your full name">
                        </div>
                        <div class="input-group">
                            <label for="public-phone">Mobile Number</label>
                            <input type="tel" id="public-phone" required placeholder="Enter your mobile number">
                        </div>
                        <div class="form-row" style="grid-template-columns: 1fr;">
                            <div class="input-group">
                                <label for="public-category">Complaint Type</label>
                                <select id="public-category">
                                    <option value="theft">Theft / Burglary</option>
                                    <option value="harassment">Harassment / Violence</option>
                                    <option value="cybercrime">Cybercrime / Fraud</option>
                                    <option value="traffic">Traffic Violation</option>
                                    <option value="missing">Missing Person</option>
                                    <option value="nuisance">Public Nuisance</option>
                                    <option value="other">Other Crime</option>
                                </select>
                            </div>
                        </div>
                        <div class="input-group">
                            <label for="public-complaint">Complaint Details</label>
                            <textarea id="public-complaint" required rows="4" placeholder="Describe your issue in detail..."></textarea>
                        </div>
                        <div id="public-error" class="error-msg"></div>
                        <div id="public-success" class="success-msg"></div>
                        <button type="submit" class="btn-primary">Submit Complaint</button>
                    </form>
                    <p class="auth-footer"><a href="#" id="go-to-login">Admin Login</a></p>
                </div>
            </section>

            <!-- Admin Login Section -->
            <section id="login-section" class="auth-section hidden">
                <div class="card glass">
                    <h2>Admin Access</h2>
                    <p>Login to manage all complaints</p>
                    <form id="login-form">
                        <div class="input-group">
                            <label for="login-email">Admin Email</label>
                            <input type="email" id="login-email" required placeholder="admin@example.com">
                        </div>
                        <div class="input-group">
                            <label for="login-password">Password</label>
                            <input type="password" id="login-password" required placeholder="••••••••">
                        </div>
                        <div id="login-error" class="error-msg"></div>
                        <button type="submit" class="btn-primary">Login as Admin</button>
                    </form>
                    <p class="auth-footer"><a href="#" id="go-to-public">Back to Submission</a></p>
                </div>
            </section>

            <!-- Admin Dashboard -->
            <section id="admin-dashboard" class="dashboard-section hidden">
                <div class="container">
                    <div class="dashboard-header">
                        <h2>Police Control Room</h2>
                        <p>Managing all reported crimes and public issues</p>
                    </div>
                    <div id="admin-complaints-list" class="complaints-grid">
                        <!-- Admin view complaints -->
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
